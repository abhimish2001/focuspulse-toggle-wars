name: FocusPulse CI/CD & Live Health Monitor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Automated Keep-Warm Ping every 14 minutes to prevent Render Free tier cold starts during judging
  schedule:
    - cron: '*/14 * * * *'
  # Allows manual health runs from the Actions tab
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Typecheck Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_FLAGSMITH_ENV_KEY: ${{ secrets.NEXT_PUBLIC_FLAGSMITH_ENV_KEY || 'esMZQYfcANsHcmozTaXb6F' }}
          NEXT_PUBLIC_ENABLE_DEMO_CONTROLS: 'false'
          NEXT_TELEMETRY_DISABLED: 1

  production-health-check:
    name: Production Service Verification & Keep-Warm
    needs: [build-and-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Synthetic Production Health Verification
        run: node scripts/verify-production.js
        env:
          TARGET_URL: 'https://focuspulse-toggle-wars.onrender.com'
