<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudFlow SaaS - Onboarding Experiment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #06b6d4;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .badge-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(79, 70, 229, 0.2);
      border: 1px solid rgba(79, 70, 229, 0.4);
      color: #818cf8;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .identity-badge {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 0.8rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Form Fields */
    .field-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    input[type="text"], input[type="email"], select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
    }

    /* Interactive guided steps (Variation B) */
    .steps-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 14px 10px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .step-card:hover, .step-card.selected {
      background: rgba(79, 70, 229, 0.15);
      border-color: var(--primary);
    }

    .step-card .icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .step-card .title {
      font-size: 0.8rem;
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Success / Conversion screen */
    .success-view {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      border: 2px solid var(--success);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 18px;
    }

    .tag-conversion {
      margin-top: 20px;
      display: inline-block;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .footer-actions {
      margin-top: 20px;
      text-align: center;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-secondary:hover {
      color: #fff;
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge-bar">
      <div id="variantBadge" class="badge">Variant: Loading...</div>
      <div id="userBadge" class="identity-badge">Identity: ...</div>
    </div>

    <!-- Active Form View -->
    <div id="experimentView">
      <h1 id="headline">Welcome to CloudFlow</h1>
      <p id="subtitle" class="subtitle">Complete your setup to unlock team collaboration tools.</p>

      <!-- CONTROL: Standard 3-Field Form -->
      <div id="controlForm" style="display:none;">
        <div class="field-group">
          <label>Full Name</label>
          <input type="text" id="ctrlName" value="Alex Smith" placeholder="Jane Doe">
        </div>
        <div class="field-group">
          <label>Work Email</label>
          <input type="email" id="ctrlEmail" value="alex@example.com" placeholder="alex@company.com">
        </div>
        <div class="field-group">
          <label>Company Name</label>
          <input type="text" id="ctrlCompany" value="Acme Corp" placeholder="Acme Inc">
        </div>
      </div>

      <!-- VARIATION: Guided Interactive Tour -->
      <div id="variationForm" style="display:none;">
        <div class="field-group">
          <label>Select Your Primary Workspace Goal</label>
          <div class="steps-container">
            <div class="step-card selected" onclick="selectCard(this)">
              <div class="icon">🚀</div>
              <div class="title">Product Launch</div>
            </div>
            <div class="step-card" onclick="selectCard(this)">
              <div class="icon">📊</div>
              <div class="title">Analytics Ops</div>
            </div>
            <div class="step-card" onclick="selectCard(this)">
              <div class="icon">🤖</div>
              <div class="title">AI Automation</div>
            </div>
          </div>
        </div>

        <div class="field-group">
          <label>Team Size</label>
          <select id="teamSize">
            <option>1 - 5 members (Starter)</option>
            <option selected>6 - 25 members (Growth)</option>
            <option>26+ members (Enterprise)</option>
          </select>
        </div>

        <div class="field-group">
          <label>Workspace Subdomain</label>
          <input type="text" id="workspaceName" value="alex-workspace" placeholder="my-team">
        </div>
      </div>

      <button id="submitBtn" class="btn-submit" onclick="submitConversion()">Complete Setup & Get Started</button>
    </div>

    <!-- SUCCESS / CONVERSION VIEW -->
    <div id="successView" class="success-view">
      <div class="success-icon">✓</div>
      <h2>Setup Completed!</h2>
      <p class="subtitle" style="margin-bottom: 12px;">Your workspace is live and ready to use.</p>
      <div class="tag-conversion">Event tracked: "completed_onboarding"</div>
      <div class="footer-actions">
        <button class="btn-secondary" onclick="simulateNewUser()">Simulate Next User</button>
      </div>
    </div>
  </div>

  <script>
    let currentUserId = localStorage.getItem('demo_user_id');
    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('demo_user_id', currentUserId);
    }
    let currentVariant = 'control';

    async function loadExperiment() {
      document.getElementById('userBadge').innerText = 'ID: ' + currentUserId;
      try {
        const res = await fetch(`/api/onboarding?userId=${encodeURIComponent(currentUserId)}`);
        const data = await res.json();
        currentVariant = data.variant || 'control';

        const badge = document.getElementById('variantBadge');
        badge.innerText = `Variant: ${currentVariant.toUpperCase()}`;

        if (currentVariant === 'guided_tour' || currentVariant === 'variation_b') {
          document.getElementById('headline').innerText = 'Personalize Your Workspace';
          document.getElementById('subtitle').innerText = 'Answer 2 quick questions to customize your workflow.';
          document.getElementById('controlForm').style.display = 'none';
          document.getElementById('variationForm').style.display = 'block';
          badge.style.background = 'rgba(6, 182, 212, 0.2)';
          badge.style.borderColor = 'rgba(6, 182, 212, 0.4)';
          badge.style.color = '#38bdf8';
        } else {
          document.getElementById('headline').innerText = 'Fast-Track Setup';
          document.getElementById('subtitle').innerText = 'Fill in your details to start using CloudFlow instantly.';
          document.getElementById('controlForm').style.display = 'block';
          document.getElementById('variationForm').style.display = 'none';
        }
      } catch (e) {
        console.error('Failed to load experiment:', e);
        document.getElementById('controlForm').style.display = 'block';
        document.getElementById('variantBadge').innerText = 'Variant: CONTROL (Fallback)';
      }
    }

    function selectCard(el) {
      document.querySelectorAll('.step-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    async function submitConversion() {
      const btn = document.getElementById('submitBtn');
      btn.innerText = 'Registering Conversion...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/conversion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId })
        });
        const data = await res.json();
        console.log('Conversion result:', data);

        document.getElementById('experimentView').style.display = 'none';
        document.getElementById('successView').style.display = 'block';
      } catch (err) {
        console.error('Failed to record conversion:', err);
        alert('Error recording conversion');
        btn.disabled = false;
        btn.innerText = 'Complete Setup & Get Started';
      }
    }

    function simulateNewUser() {
      currentUserId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('demo_user_id', currentUserId);
      document.getElementById('successView').style.display = 'none';
      document.getElementById('experimentView').style.display = 'block';
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').innerText = 'Complete Setup & Get Started';
      loadExperiment();
    }

    loadExperiment();
  </script>
</body>
</html>
